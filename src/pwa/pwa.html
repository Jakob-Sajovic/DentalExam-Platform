<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#00796b" />
    <meta name="description" content="Vnos podatkov zobozdravstvenega pregleda in 3D skenov — platforma" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dentalni pregled 3D" />
    <title>Zobozdravstveni pregled — platforma</title>
</head>
<body>
    <div id="app">
        <div id="update-banner" class="update-banner" hidden>
            <span>Na voljo je nova različica aplikacije.</span>
            <button type="button" id="update-reload-btn" class="update-banner-btn">Osveži</button>
        </div>

        <div class="autosave-bar">
            <span id="build-id" class="build-id"></span>
            <span id="autosave-indicator" class="autosave-indicator"></span>
        </div>

        <nav id="tab-bar" class="tab-bar"></nav>

        <div id="panel-container" class="panel-container">
            <div class="tab-panel" data-tab="landing"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="patient"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="plaque-bleeding"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="icdas"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="fillings"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="probing"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="radiographs"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="scans3d"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="notes"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="ohip"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="fdi"><div class="panel-scroll"></div></div>
            <div class="tab-panel" data-tab="save-report"><div class="panel-scroll"></div></div>
        </div>
    </div>
</body>
</html>
